name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev,mcp]"

      - name: Run tests
        run: |
          pytest tests/unit/ tests/integration/ -q --tb=short
          python scripts/export_mcp_schemas.py --output schemas/mcp-v2 --check

  mcp-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimum supported MCP SDK
        run: pip install -e ".[dev,mcp]" "mcp==2.2.0"
      - name: Run MCP protocol tests
        run: pytest tests/unit/test_mcp_server.py tests/integration/test_mcp_contract.py tests/integration/test_mcp_stdio.py -q --tb=short

  cli-core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install without MCP extra
        run: pip install -e ".[dev]"
      - name: Verify CLI without MCP SDK
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('mcp') is None"
          legalize --help
          pytest tests/unit/test_json_schema_version.py tests/integration/test_cli_smoke.py -q --tb=short
